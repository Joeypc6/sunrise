ids = ["method:GuiCanvas::fluid", "type:GuiDrawError"]
why = "GuiCanvas::fluid draws a fluid stack's look over a rectangle (#6123): fluid(&FluidStack, [x, y, w, h]) tiles the sprite the fluid's look names (data/<mod>/sunrise/fluid/) at its own pixel size from the top left, multiplied by the look's tint, as the recipe panel draws a fluid (NeoForge IClientFluidTypeExtensions getStillTexture and getTintColor); a fluid with no sprite, such as vanilla water and lava, fills with its colour. It honours the canvas pose and scissor. GuiDrawError gains UnknownFluid, returned for a fluid that is not registered."
migrate = "Call canvas.fluid(&stack, rect) inside DrawContext::draw_gui or an item decorator's canvas instead of guessing a block/<fluid>_still sprite and tint. Let the non-exhaustive match on GuiDrawError handle UnknownFluid."
