ids = ["handle:LevelRef::schedule_block_tick", "handle:LevelRef::schedule_fluid_tick", "type:TickPriority"]
why = "A mod queues a scheduled block or fluid tick from any server hook, as Java mods call level.scheduleTick(pos, block, delay) (#6125): the same queue update_shape's schedule_block_tick writes, saved with the chunk and run in tick order, ignored when the block at the position has changed by the time it is due. Inside a transaction it is queued at commit. TickPriority is net.minecraft.world.ticks.TickPriority."
migrate = "Additive: nothing to change."
